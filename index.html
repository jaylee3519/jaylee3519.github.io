<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>IELTS 28일 커리큘럼 트래커</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;padding:24px 16px}.container{max-width:900px;margin:0 auto}h1{font-size:22px;font-weight:600;color:#f8fafc;margin-bottom:4px}.subtitle{font-size:13px;color:#64748b;margin-bottom:32px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}.stat{background:#1e2330;border:1px solid #2d3748;border-radius:12px;padding:16px}.stat-num{font-size:26px;font-weight:600;color:#f8fafc}.stat-label{font-size:11px;color:#64748b;margin-top:4px}.prog-row{margin-bottom:10px}.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-bottom:5px}.prog-track{background:#1e2330;border-radius:20px;height:6px;overflow:hidden}.prog-fill{height:6px;border-radius:20px;transition:width .4s ease}.week-section{margin-bottom:28px}.week-header{margin-bottom:14px}.week-badge{font-size:11px;font-weight:500;padding:3px 12px;border-radius:20px}.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.day-card{background:#1e2330;border:1px solid #2d3748;border-radius:12px;padding:14px;cursor:pointer}.day-card.done{border-left:3px solid #22c55e;background:#1a2e1e}.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.day-num{font-size:12px;font-weight:600;color:#94a3b8}.skill-tag{font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px}.day-task{font-size:12px;color:#cbd5e1;line-height:1.55;margin-bottom:8px}.day-meta{font-size:10px;color:#475569;margin-bottom:10px}.check-btn{width:100%;font-size:11px;padding:5px;border-radius:8px;border:1px solid #2d3748;background:transparent;color:#94a3b8;cursor:pointer}.check-btn:hover{background:#2d3748;color:#e2e8f0}.day-card.done .check-btn{border-color:#22c55e;color:#22c55e}.divider{height:1px;background:#1e2330;margin:20px 0}footer{margin-top:40px;text-align:center;font-size:11px;color:#334155}</style></head><body><div class="container"><h1>IELTS 28일 커리큘럼 트래커</h1><p class="subtitle">Band 7.0+ 목표 · 하루 30~60분 · 슈퍼잉글리쉬 자료 기반</p><div class="stats"><div class="stat"><div class="stat-num" id="s-done">0</div><div class="stat-label">완료한 날</div></div><div class="stat"><div class="stat-num" id="s-left">28</div><div class="stat-label">남은 날</div></div><div class="stat"><div class="stat-num" id="s-streak">0</div><div class="stat-label">연속 완료</div></div><div class="stat"><div class="stat-num" id="s-pct">0%</div><div class="stat-label">전체 진행률</div></div></div><div style="margin-bottom:32px"><div class="prog-row"><div class="prog-meta"><span>전체</span><span id="pl-all">0%</span></div><div class="prog-track"><div class="prog-fill" id="pf-all" style="width:0%;background:#3b82f6"></div></div></div><div class="prog-row"><div class="prog-meta"><span>Writing</span><span id="pl-w">0%</span></div><div class="prog-track"><div class="prog-fill" id="pf-w" style="width:0%;background:#6366f1"></div></div></div><div class="prog-row"><div class="prog-meta"><span>Speaking</span><span id="pl-s">0%</span></div><div class="prog-track"><div class="prog-fill" id="pf-s" style="width:0%;background:#f97316"></div></div></div><div class="prog-row"><div class="prog-meta"><span>Reading/Vocab</span><span id="pl-r">0%</span></div><div class="prog-track"><div class="prog-fill" id="pf-r" style="width:0%;background:#eab308"></div></div></div></div><div id="curriculum"></div><footer>jaylee3519 · IELTS Study Tracker</footer></div><script>const W=[{l:'Week 1 — 기초 다지기',b:'#1e3a5f',t:'#93c5fd',d:[{s:'Writing',c:'#1e3a5f',tc:'#93c5fd',task:'Task 1 구조 파악 — Outline 4단계 숙지. 선 그래프 모범답안(7점) 문제 1 정독',r:'라이팅>Task1 고득점(7)',tm:'50분'},{s:'Vocab',c:'#14532d',tc:'#86efac',task:'리딩 6점 필수단어 001~30. 동의어 세트로 묶어서 암기',r:'보너스>리딩 6점 필수단어',tm:'30분'},{s:'Speaking',c:'#7c2d12',tc:'#fdba74',task:'Part 1 패턴 Day 1~2 (10개 표현) 소리 내어 읽기 3회',r:'보너스>Part1 패턴 학습지',tm:'30분'},{s:'Writing',c:'#1e3a5f',tc:'#93c5fd',task:'Task 1 막대 그래프 모범답안(7점) 문제 2 정독. 핵심 표현 5개 암기',r:'라이팅>Task1 고득점(7)',tm:'50분'},{s:'Reading',c:'#713f12',tc:'#fde68a',task:'Tennis 워크시트 Paragraph 1~2 단어 정리 + 문장 분석',r:'리딩>tennis_complete',tm:'40분'},{s:'Vocab',c:'#14532d',tc:'#86efac',task:'리딩 필수단어 031~60. 전날 001~30 빠른 복습 후 추가',r:'보너스>리딩 6점 필수단어',tm:'30분'},{s:'복습',c:'#1e293b',tc:'#94a3b8',task:'Week 1 복습 — 틀린 핵심 표현 오답 노트 정리',r:'전 자료 참고',tm:'15분'}]},{l:'Week 2 — Writing 집중',b:'#312e81',t:'#a5b4fc',d:[{s:'Writing',c:'#1e3a5f',tc:'#93c5fd',task:'Task 1 지도·다이어그램 모범답안(7점) 문제 3 정독. 수동태 표현 집중 연습',r:'라이팅>Task1 고득점(7)',tm:'50분'},{s:'Writing',c:'#1e3a5f',tc:'#93c5fd',task:'Task 2 고득점(7점) 문제 1 정독. 4단락 구조 틀 분석',r:'라이팅>Task2 고득점(7)',tm:'50분'},{s:'Speaking',c:'#7c2d12',tc:'#fdba74',task:'Part 1 고득점 모범답안 Study 토픽 정독. Band 8 표현 정리',r:'스피킹>스피킹파트1고득점',tm:'40분'},{s:'Vocab',c:'#14532d',tc:'#86efac',task:'주제별 핵심단어 환경·기후 20개 학습',r:'보너스>스피킹라이팅 주제별단어',tm:'30분'},{s:'Reading',c:'#713f12',tc:'#fde68a',task:'Pirates 워크시트 Paragraph A~B 단어 + 문장 분석. 도치 구문 정리',r:'리딩>pirates_complete',tm:'40분'},{s:'Writing',c:'#1e3a5f',tc:'#93c5fd',task:'Task 1 파이차트 모범답안(7점) 문제 4 정독 후 빈칸 채우기',r:'라이팅>Task1 고득점(7)',tm:'50분'},{s:'복습',c:'#1e293b',tc:'#94a3b8',task:'Week 2 복습 — Task 1·2 핵심 표현 총정리',r:'전 자료 참고',tm:'15분'}]},{l:'Week 3 — Speaking & Reading',b:'#7c2d12',t:'#fdba74',d:[{s:'Speaking',c:'#7c2d12',tc:'#fdba74',task:'Part 2 압축 모범답안 스토리 1~2 비교 분석',r:'스피킹>Part2 압축모범답안',tm:'40분'},{s:'Speaking',c:'#7c2d12',tc:'#fdba74',task:'Part 3 템플릿 유형 1~3 (이유/장단점/비교) 암기 + 본인 답변 작성',r:'스피킹>Part3 템플릿10개',tm:'40분'},{s:'Vocab',c:'#14532d',tc:'#86efac',task:'주제별 핵심단어 기술·SNS 20개. 25일 단어 챌린지 Day 1 시작',r:'보너스>단어챌린지500개',tm:'30분'},{s:'Reading',c:'#713f12',tc:'#fde68a',task:'Misinformation 워크시트 Paragraph 1~2 정독 + 연습문제',r:'리딩>misinfo_complete',tm:'40분'},{s:'Speaking',c:'#7c2d12',tc:'#fdba74',task:'최신 Topics Part 1에서 5개 토픽 골라 즉답 연습 (녹음 권장)',r:'스피킹>5-8월 최신Topics',tm:'40분'},{s:'Writing',c:'#1e3a5f',tc:'#93c5fd',task:'Task 2 고득점(7점) 문제 2 정독. 디스코스마커 실전 적용',r:'라이팅>Task2+연결어구',tm:'50분'},{s:'복습',c:'#1e293b',tc:'#94a3b8',task:'Week 3 복습 — Speaking 녹음 자기 피드백. 단어 누락분 확인',r:'전 자료 참고',tm:'15분'}]},{l:'Week 4 — 실전 & 통합',b:'#713f12',t:'#fde68a',d:[{s:'Writing',c:'#1e3a5f',tc:'#93c5fd',task:'Task 1 실전 — 새 그래프 50분 타이머 직접 작성. Claude에게 채점 요청',r:'라이팅 자료 전체',tm:'50분'},{s:'Speaking',c:'#7c2d12',tc:'#fdba74',task:'Part 2+3 통합 — Topic 1개 2분 스피치 + Part 3 질문 3개 연속 답변',r:'스피킹>최신Topics+Part3',tm:'40분'},{s:'Reading',c:'#713f12',tc:'#fde68a',task:'Test 1 정답 해설 전체 검토. 동의어 테이블 paraphrasing 총정리',r:'리딩>Answer Key+Synonym Table',tm:'40분'},{s:'Writing',c:'#1e3a5f',tc:'#93c5fd',task:'Task 2 실전 — 새 주제 40분 타이머 직접 작성. Band 7 모범답안과 비교',r:'라이팅>Task2 고득점(7)',tm:'50분'},{s:'Vocab',c:'#14532d',tc:'#86efac',task:'왕초보 표현 50개 최종 점검 + 디스코스마커 10개 실전 문장 만들기',r:'보너스>왕초보표현50개+연결어구',tm:'30분'},{s:'모의시험',c:'#1e293b',tc:'#94a3b8',task:'Task 1(20분)+Task 2(40분)+Speaking Part 1(10분). 총 70분 모의시험',r:'전 자료 통합',tm:'70분'},{s:'마무리',c:'#1e293b',tc:'#94a3b8',task:'최종 정리 — 오답 표현 재확인. 시험장 지참 핵심 표현 리스트 작성',r:'전 자료 참고',tm:'20분'}]}];const SM={Writing:'w',Speaking:'s',Reading:'r',Vocab:'r'};let st={};try{const v=localStorage.getItem('ielts28');if(v)st=JSON.parse(v);}catch(e){}function sv(){try{localStorage.setItem('ielts28',JSON.stringify(st));}catch(e){}}function k(a,b){return a+'_'+b;}function upd(){let dn=0,wD=0,wT=0,sD=0,sT=0,rD=0,rT=0;W.forEach((w,wi)=>w.d.forEach((d,di)=>{const ok=!!st[k(wi,di)];if(ok)dn++;const sk=SM[d.s];if(sk==='w'){wT++;if(ok)wD++;}else if(sk==='s'){sT++;if(ok)sD++;}else if(sk==='r'){rT++;if(ok)rD++;}}));document.getElementById('s-done').textContent=dn;document.getElementById('s-left').textContent=28-dn;document.getElementById('s-pct').textContent=Math.round(dn/28*100)+'%';let sr=0;for(let wi=0;wi<W.length;wi++){let brk=false;for(let di=0;di<W[wi].d.length;di++){if(st[k(wi,di)])sr++;else{brk=true;break;}}if(brk)break;}document.getElementById('s-streak').textContent=sr;const p=v=>Math.round(v*100)+'%';['all','w','s','r'].forEach(id=>{const v=id==='all'?dn/28:id==='w'?wD/wT:id==='s'?sD/sT:rD/rT;document.getElementById('pl-'+id).textContent=p(isNaN(v)?0:v);document.getElementById('pf-'+id).style.width=p(isNaN(v)?0:v);});}function toggle(wi,di){st[k(wi,di)]=!st[k(wi,di)];sv();rc(wi,di);upd();}function rc(wi,di){const d=W[wi].d[di],ok=!!st[k(wi,di)],el=document.getElementById('dc-'+wi+'-'+di);if(!el)return;el.className='day-card'+(ok?' done':'');el.innerHTML='<div class="day-head"><span class="day-num">Day '+(wi*7+di+1)+'</span><span class="skill-tag" style="background:'+d.c+';color:'+d.tc+'">'+d.s+'</span></div><div class="day-task">'+d.task+'</div><div class="day-meta">'+d.r+' · '+d.tm+'</div><button class="check-btn" onclick="toggle('+wi+','+di+')">'+(ok?'✓ 완료됨':'완료 체크')+'</button>';}document.getElementById('curriculum').innerHTML=W.map((w,wi)=>'<div class="week-section"><div class="week-header"><span class="week-badge" style="background:'+w.b+';color:'+w.t+'">'+w.l+'</span></div><div class="days">'+w.d.map((_,di)=>'<div class="day-card" id="dc-'+wi+'-'+di+'"></div>').join('')+'</div></div>'+(wi<W.length-1?'<div class="divider"></div>':'')).join('');W.forEach((w,wi)=>w.d.forEach((_,di)=>rc(wi,di)));upd();</script></body></html>
